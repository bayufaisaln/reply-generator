<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reply Fb</title>
    <meta name="theme-color" content="#1877F2">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <style>
        :root {
            --primary: #1877F2;
            --primary-dark: #145dbf;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1c1e21;
            --text-secondary: #65676b;
            --danger: #e41e3f;
            --success: #42b72a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
        }
        .header h1 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button:active { transform: scale(0.98); }
        .btn-secondary { background-color: #e4e6eb; color: var(--text); }
        .btn-secondary:hover { background-color: #d8dadf; }
        .btn-danger { background-color: #ffebee; color: var(--danger); }
        .btn-danger:hover { background-color: #ffcdd2; }
        .btn-primary { 
            background-color: var(--primary); 
            color: white; 
            width: 100%; 
            padding: 14px;
            font-size: 16px;
            margin-top: 8px;
        }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-success { 
            background-color: var(--success); 
            color: white; 
            width: 100%;
            margin-top: 10px;
        }
        .btn-success:hover { background-color: #36a420; }
        .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>💬 Reply Fb</h1>
    </div>

    <div class="card">
        <label for="inputText">1. Tempel Teks Produk Di Sini</label>
        <textarea id="inputText" placeholder="Contoh: Cek Maxx1 Ban Motor Matic Tubeless Ring 14 Retread Tyre untuk Beat dengan harga Rp175.000. Dapatkan di Shopee sekarang! https://s.shopee.co.id/5LD0kXc0xS"></textarea>
        
        <div class="button-group">
            <button class="btn-secondary" onclick="pasteText()">📋 Tempel</button>
            <button class="btn-danger" onclick="clearText()">🗑️ Hapus</button>
        </div>
        <div class="hint">Tips: Pastikan izin clipboard diberikan saat pertama kali menempel.</div>
    </div>

    <button class="btn-primary" onclick="generateReply()">✨ Generate Balasan</button>

    <div class="card" style="margin-top: 16px;">
        <label for="outputText">2. Hasil Rekomendasi Balasan</label>
        <textarea id="outputText" readonly placeholder="Hasil akan muncul di sini..."></textarea>
        <button class="btn-success" onclick="copyText()">📋 Salin Balasan</button>
    </div>

    <script>
        // --- KONFIGURASI VARIASI ---
        const openings = [
            'READY', 'READY STOCK', 'Ready', 'Ready ya', 
            'Stok ready', 'Stok aman', 'Masih ready', 'Masih tersedia', 
            'Tersedia', 'Available', 'Barang ready', 'Ready stock'
        ];
        let lastOpening = '';

        const priceTemplates = [
            '{price}', 'Harga {price}', 'Cuma {price}', 'Mulai {price}', 
            '{price} aja', 'Hanya {price}', 'Harga mulai {price}'
        ];

        const ctas = [
            'Cek di sini 👇', 'Silakan cek 👇', 'Order di sini 👇', 
            'Langsung order 👇', 'Link 👇', 'Cek link 👇', 
            'Ambil di sini 👇', 'Checkout di sini 👇', 'Dapatkan di sini 👇', 'Beli di sini 👇'
        ];

        // --- FUNGSI UTILITAS ---
        function getRandomOpening() {
            let pick;
            do {
                pick = openings[Math.floor(Math.random() * openings.length)];
            } while (pick === lastOpening && openings.length > 1);
            lastOpening = pick;
            return pick;
        }

        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputText').value = text;
            } catch (err) {
                alert('Gagal menempel. Pastikan Anda memberikan izin clipboard atau tempel manual (Ctrl+V / Tahan lalu Tempel).');
            }
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
        }

        function generateReply() {
            const input = document.getElementById('inputText').value;
            if (!input.trim()) {
                alert('Masukkan atau tempel teks produk terlebih dahulu!');
                return;
            }

            // 1. Ekstrak Link (URL)
            const linkMatch = input.match(/https?:\/\/[^\s]+/);
            const link = linkMatch ? linkMatch[0] : 'https://s.shopee.co.id/xxxx';

            // 2. Ekstrak Harga (format Rp...)
            const priceMatch = input.match(/Rp[\d\.]+/);
            const price = priceMatch ? priceMatch[0] : 'Rp0';

            // 3. Ekstrak Nama Produk (Maksimal 6 kata, buang [] dan ())
            let cleanText = input
                .replace(/\[.*?\]/g, '')       // Hapus teks dalam [...]
                .replace(/\(.*?\)/g, '')       // Hapus teks dalam (...)
                .replace(/https?:\/\/[^\s]+/g, '') // Hapus link
                .replace(/dengan harga.*/i, '')    // Hapus "dengan harga..." ke bawah
                .replace(/Dapatkan di Shopee sekarang!/i, '') // Hapus frasa umum affiliate
                .trim();

            // Pecah menjadi kata-kata
            let words = cleanText.split(/\s+/).filter(w => w.length > 0);
            
            // Hapus kata perintah umum di awal jika ada (opsional, agar nama produk lebih bersih)
            if (words.length > 0 && (words[0].toLowerCase() === 'cek' || words[0].toLowerCase() === 'jual')) {
                words = words.slice(1);
            }
            
            // Ambil maksimal 6 kata
            const productName = words.slice(0, 6).join(' ') || 'Produk';

            // 4. Acak Variasi
            const opening = getRandomOpening();
            const priceTemplate = priceTemplates[Math.floor(Math.random() * priceTemplates.length)];
            const formattedPrice = priceTemplate.replace('{price}', price);
            const cta = ctas[Math.floor(Math.random() * ctas.length)];

            // 5. Susun Output
            const output = `${opening}, ${productName} ✅\n${formattedPrice}\n${cta}\n${link}`;
            
            document.getElementById('outputText').value = output;
        }

        async function copyText() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) return;
            
            outputText.select();
            outputText.setSelectionRange(0, 99999); // Untuk mobile
            
            try {
                await navigator.clipboard.writeText(outputText.value);
                // Feedback visual sementara pada tombol
                const btn = document.querySelector('.btn-success');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Berhasil Disalin!';
                btn.style.backgroundColor = '#36a420';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.backgroundColor = '';
                }, 1500);
            } catch (err) {
                document.execCommand('copy'); // Fallback
                alert('Berhasil disalin!');
            }
        }

        // --- SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
