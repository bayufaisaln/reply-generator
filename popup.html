<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Reply Fb</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Reply Fb</h2>

    <div class="input-group">
      <label>Link Affiliate Shortlink:</label>
      <input type="text" id="affiliate-link" placeholder="Tempel shortlink shopee di sini...">
    </div>

    <details class="settings">
      <summary>⚙️ Pengaturan Balasan</summary>
      <label>Mode:</label>
      <select id="mode">
        <option value="local">Lokal (gratis, tanpa API) ✅</option>
        <option value="gemini">Gemini (gratis, perlu API key)</option>
        <option value="custom">OpenAI-compatible (custom)</option>
      </select>
      <div id="api-fields" style="display:none">
        <input type="password" id="api-key" placeholder="API key">
        <input type="text" id="api-model" placeholder="Model (mis. gemini-2.5-flash)">
        <input type="text" id="api-url" placeholder="URL (khusus custom, .../v1/chat/completions)">
      </div>
    </details>

    <button id="btn-scrape" class="btn-primary">🚀 Ambil Data & Buat Balasan</button>
    <div id="status" class="status"></div>

    <div id="result-section" style="display:none; margin-top:10px;">
      <h3>Detail Produk:</h3>
      <p><strong>Judul:</strong> <span id="res-title"></span></p>
      <p><strong>Harga:</strong> Rp <span id="res-price"></span></p>

      <h3>💬 Balasan:</h3>
      <textarea id="caption-result" rows="5"></textarea>

      <button id="btn-regen" class="btn-secondary">🔄 Ganti Redaksi</button>
      <button id="btn-copy" class="btn-secondary">📋 Copy Balasan</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
